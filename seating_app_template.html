<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자리 배치 프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --mint:#10B981;
    --mint-dark:#059669;
    --mint-light:#D1FAE5;
    --bg:#F8FAFC;
    --warn:#F59E0B;
    --danger:#EF4444;
  }
  *{ font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; box-sizing:border-box; }
  body{ background:var(--bg); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#CBD5E1; border-radius:9999px; }
  input, select, textarea{ outline:none; }
  input:focus, select:focus, textarea:focus{ box-shadow:0 0 0 3px var(--mint-light); border-color:var(--mint); }
  .tab-btn{ color:#64748B; }
  .tab-btn.active{ background:var(--mint); color:#fff; }
  .seat{ transition:transform .15s ease, box-shadow .15s ease; }
  .seat:not(.blocked):hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(15,23,42,.08); }
  .seat.selected{ outline:3px solid var(--mint); outline-offset:2px; }
  .seat.blocked{ background:repeating-linear-gradient(45deg,#F1F5F9,#F1F5F9 6px,#E2E8F0 6px,#E2E8F0 12px); cursor:default; }
  .seat:not(.blocked){ cursor:grab; }
  .seat.dragging{ opacity:.35; }
  .seat.drag-over{ outline:3px dashed var(--mint); outline-offset:2px; background:var(--mint-light); }
  .violation-must{ box-shadow:0 0 0 3px var(--warn) inset; }
  .violation-avoid{ box-shadow:0 0 0 3px var(--danger) inset; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; box-shadow:none !important; }
  }
</style>
</head>
<body class="text-slate-800 min-h-screen pb-24">

<header class="bg-white shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🪑</span>
      <h1 class="text-lg font-bold">자리 배치 프로그램</h1>
    </div>
    <nav id="tabNav" class="flex flex-wrap gap-1 bg-slate-100 rounded-xl p-1">
      <button data-tab="students" class="tab-btn active px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200">① 학생 명단</button>
      <button data-tab="layout" class="tab-btn px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200">② 교실 구조</button>
      <button data-tab="rules" class="tab-btn px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200">③ 제약 조건</button>
      <button data-tab="arrange" class="tab-btn px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200">④ 자리 배치</button>
    </nav>
    <div id="saveIndicator" class="text-xs text-slate-400">&nbsp;</div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <section id="tab-students"></section>
  <section id="tab-layout" class="hidden"></section>
  <section id="tab-rules" class="hidden"></section>
  <section id="tab-arrange" class="hidden"></section>
</main>

<div id="modalOverlay" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-md p-6 max-w-sm w-full">
    <p id="modalMessage" class="text-sm text-slate-700 mb-4 whitespace-pre-line"></p>
    <div id="modalInputWrap" class="hidden mb-4">
      <input id="modalInput" class="w-full rounded-xl border border-slate-200 p-2.5 text-sm">
    </div>
    <div class="flex justify-end gap-2">
      <button id="modalCancelBtn" class="hidden px-4 py-2 rounded-xl text-sm font-medium text-slate-500 hover:bg-slate-100 transition-all duration-200 active:scale-95">취소</button>
      <button id="modalConfirmBtn" class="px-4 py-2 rounded-xl text-sm font-medium bg-[#10B981] hover:bg-[#059669] text-white transition-all duration-200 active:scale-95">확인</button>
    </div>
  </div>
</div>

<script>
/* ===================== 상태 관리 ===================== */
let state;
let selectedSeat = null;
let dragSourceSeat = null;

function defaultState(){
  return {
    idCounter: 1,
    classInfo: { grade:'', class:'' },
    quote: '',
    students: [],
    seatConfig: { rows:5, cols:6, blocked:['0-0'], deskPosition:'bottom', frontRows:2, corridorLabel:'복도', windowLabel:'창가' },
    constraints: { pairs:[], fixed:[], genderMode:'none', avoidRepeatFromHistory:false },
    arrangement: {},
    history: []
  };
}
function load(){
  try{
    const raw = localStorage.getItem('seatAppState_v1');
    if(raw){
      const parsed = Object.assign(defaultState(), JSON.parse(raw));
      if(!parsed.constraints.genderMode){
        parsed.constraints.genderMode = parsed.constraints.avoidGenderAdjacent ? 'separate' : 'none';
      }
      parsed.students.forEach((s,i)=>{
        if(s.no===undefined || s.no===null || isNaN(s.no)) s.no = i+1;
        s.needFront = !!s.needFront;
        s.needBack = !!s.needBack;
        s.needWindow = !!s.needWindow;
        s.needCorridor = !!s.needCorridor;
        s.height = s.height || '';
      });
      return parsed;
    }
  }catch(e){}
  return defaultState();
}
function getNextStudentNo(){
  if(!state.students.length) return 1;
  return Math.max(...state.students.map(s=>s.no||0)) + 1;
}
function save(){
  localStorage.setItem('seatAppState_v1', JSON.stringify(state));
  const ind = document.getElementById('saveIndicator');
  if(ind) ind.textContent = '자동 저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
}
function nowStr(){
  return new Date().toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function nextId(){
  state.idCounter = (state.idCounter||1) + 1;
  return state.idCounter;
}
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function emptyState(msg){
  return `<div class="text-center py-12 text-slate-400">
    <div class="text-4xl mb-2">🌱</div>
    <p class="text-sm">${msg}</p>
  </div>`;
}
function studentName(id){ return state.students.find(s=>s.id===id)?.name || '(삭제됨)'; }
function studentGender(id){ return state.students.find(s=>s.id===id)?.gender || ''; }

function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
}
function showAlert(message){
  return new Promise(resolve=>{
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalInputWrap').classList.add('hidden');
    const cancelBtn = document.getElementById('modalCancelBtn');
    const okBtn = document.getElementById('modalConfirmBtn');
    cancelBtn.classList.add('hidden');
    okBtn.textContent = '확인';
    document.getElementById('modalOverlay').classList.remove('hidden');
    okBtn.onclick = ()=>{ closeModal(); resolve(true); };
  });
}
function showConfirm(message){
  return new Promise(resolve=>{
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalInputWrap').classList.add('hidden');
    const cancelBtn = document.getElementById('modalCancelBtn');
    const okBtn = document.getElementById('modalConfirmBtn');
    cancelBtn.classList.remove('hidden');
    okBtn.textContent = '확인';
    document.getElementById('modalOverlay').classList.remove('hidden');
    cancelBtn.onclick = ()=>{ closeModal(); resolve(false); };
    okBtn.onclick = ()=>{ closeModal(); resolve(true); };
  });
}
function showPrompt(message, defaultValue){
  return new Promise(resolve=>{
    document.getElementById('modalMessage').textContent = message;
    const inputWrap = document.getElementById('modalInputWrap');
    const input = document.getElementById('modalInput');
    inputWrap.classList.remove('hidden');
    input.value = defaultValue || '';
    const cancelBtn = document.getElementById('modalCancelBtn');
    const okBtn = document.getElementById('modalConfirmBtn');
    cancelBtn.classList.remove('hidden');
    okBtn.textContent = '확인';
    document.getElementById('modalOverlay').classList.remove('hidden');
    setTimeout(()=>input.focus(), 50);
    cancelBtn.onclick = ()=>{ closeModal(); resolve(null); };
    okBtn.onclick = ()=>{ closeModal(); resolve(input.value); };
  });
}

/* ===================== 좌석 계산 ===================== */
function activeSeatList(){
  const { rows, cols, blocked } = state.seatConfig;
  const list=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const id = `${r}-${c}`;
      if(!blocked.includes(id)) list.push(id);
    }
  }
  return list;
}
function seatNumberMap(){
  const seats = activeSeatList();
  const map = {};
  seats.forEach((s,i)=> map[s] = i+1);
  return map;
}
function isAdjacent(a,b){
  const [ra,ca] = a.split('-').map(Number);
  const [rb,cb] = b.split('-').map(Number);
  if(ra===rb && Math.abs(ca-cb)===1) return true;
  if(ca===cb && Math.abs(ra-rb)===1) return true;
  return false;
}
function isFrontSeat(seatId){
  const [r] = seatId.split('-').map(Number);
  const { rows, deskPosition, frontRows } = state.seatConfig;
  return deskPosition==='bottom' ? r >= rows - frontRows : r < frontRows;
}
function isBackSeat(seatId){
  const [r] = seatId.split('-').map(Number);
  const { rows, deskPosition } = state.seatConfig;
  return deskPosition==='bottom' ? r===0 : r===rows-1;
}
function isWindowSeat(seatId){
  const [, c] = seatId.split('-').map(Number);
  return c === state.seatConfig.cols - 1;
}
function isCorridorSeat(seatId){
  const [, c] = seatId.split('-').map(Number);
  return c === 0;
}
function heightZoneOfSeat(seatId){
  const [r] = seatId.split('-').map(Number);
  const { rows, deskPosition } = state.seatConfig;
  const distFromDesk = deskPosition==='bottom' ? (rows-1-r) : r; // 0=교탁과 가장 가까움(앞), rows-1=가장 멂(뒤)
  const third = rows/3;
  if(distFromDesk < third) return '저';
  if(distFromDesk < third*2) return '중';
  return '고';
}
function getAdjacentPairs(mapping){
  const seatIds = Object.keys(mapping);
  const res=[];
  for(let i=0;i<seatIds.length;i++){
    for(let j=i+1;j<seatIds.length;j++){
      if(isAdjacent(seatIds[i], seatIds[j])){
        const a = mapping[seatIds[i]], b = mapping[seatIds[j]];
        if(a && b) res.push([a,b]);
      }
    }
  }
  return res;
}
function adjacentPairKeySet(mapping){
  return new Set(getAdjacentPairs(mapping).map(([a,b]) => a<b ? `${a}_${b}` : `${b}_${a}`));
}

/* ===================== 자동 배치 알고리즘 ===================== */
function scoreArrangement(mapping, prevPairKeys){
  let score = 0;
  const seatOf = {};
  Object.entries(mapping).forEach(([seat,stu]) => { if(stu) seatOf[stu]=seat; });

  state.constraints.pairs.forEach(p=>{
    const sa = seatOf[p.a], sb = seatOf[p.b];
    if(!sa || !sb) return;
    const adj = isAdjacent(sa, sb);
    if(p.type==='must' && !adj) score += 10;
    if(p.type==='avoid' && adj) score += 15;
  });

  state.students.forEach(st=>{
    if(st.needFront){
      const seat = seatOf[st.id];
      if(seat && !isFrontSeat(seat)) score += 3;
    }
    if(st.needBack){
      const seat = seatOf[st.id];
      if(seat && !isBackSeat(seat)) score += 3;
    }
    if(st.needWindow){
      const seat = seatOf[st.id];
      if(seat && !isWindowSeat(seat)) score += 3;
    }
    if(st.needCorridor){
      const seat = seatOf[st.id];
      if(seat && !isCorridorSeat(seat)) score += 3;
    }
    if(st.height){
      const seat = seatOf[st.id];
      if(seat && heightZoneOfSeat(seat) !== st.height) score += 3;
    }
  });

  if(state.constraints.genderMode!=='none' || prevPairKeys){
    const adjPairs = getAdjacentPairs(mapping);
    if(state.constraints.genderMode!=='none'){
      adjPairs.forEach(([a,b])=>{
        const ga = studentGender(a), gb = studentGender(b);
        if(!ga || !gb) return;
        if(state.constraints.genderMode==='separate' && ga!==gb) score += 4;
        if(state.constraints.genderMode==='alternate' && ga===gb) score += 4;
      });
    }
    if(prevPairKeys){
      adjPairs.forEach(([a,b])=>{
        const key = a<b ? `${a}_${b}` : `${b}_${a}`;
        if(prevPairKeys.has(key)) score += 5;
      });
    }
  }
  return score;
}

function beforeChange(label){
  if(Object.keys(state.arrangement).length===0) return;
  state.history.unshift({ id:nextId(), label, time:nowStr(), arrangement:{...state.arrangement} });
  if(state.history.length>15) state.history.length = 15;
}

function computeViolations(){
  const seatOf = {};
  Object.entries(state.arrangement).forEach(([seat,stu]) => { if(stu) seatOf[stu]=seat; });
  const list = [];
  state.constraints.pairs.forEach(p=>{
    const sa = seatOf[p.a], sb = seatOf[p.b];
    if(!sa || !sb) return;
    const adj = isAdjacent(sa, sb);
    if(p.type==='must' && !adj) list.push({ type:'warn', seats:[sa,sb], text:`${studentName(p.a)} · ${studentName(p.b)} — 붙여야 하는데 떨어져 있어요` });
    if(p.type==='avoid' && adj) list.push({ type:'danger', seats:[sa,sb], text:`${studentName(p.a)} · ${studentName(p.b)} — 떨어뜨려야 하는데 붙어 있어요` });
  });
  state.students.forEach(st=>{
    if(st.needFront){
      const seat = seatOf[st.id];
      if(seat && !isFrontSeat(seat)) list.push({ type:'warn', seats:[seat], text:`${st.name} — 앞자리가 필요한데 뒤쪽에 배치됐어요` });
    }
    if(st.needBack){
      const seat = seatOf[st.id];
      if(seat && !isBackSeat(seat)) list.push({ type:'warn', seats:[seat], text:`${st.name} — 맨 뒷자리가 필요한데 그 자리가 아니에요` });
    }
    if(st.needWindow){
      const seat = seatOf[st.id];
      if(seat && !isWindowSeat(seat)) list.push({ type:'warn', seats:[seat], text:`${st.name} — ${state.seatConfig.windowLabel} 쪽이 필요한데 그쪽이 아니에요` });
    }
    if(st.needCorridor){
      const seat = seatOf[st.id];
      if(seat && !isCorridorSeat(seat)) list.push({ type:'warn', seats:[seat], text:`${st.name} — ${state.seatConfig.corridorLabel} 쪽이 필요한데 그쪽이 아니에요` });
    }
    if(st.height){
      const seat = seatOf[st.id];
      if(seat && heightZoneOfSeat(seat) !== st.height) list.push({ type:'warn', seats:[seat], text:`${st.name} — 키(${st.height}) 기준으로 맞는 줄이 아니에요` });
    }
  });
  return list;
}

/* ===================== 탭 전환 ===================== */
function switchTab(name){
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  ['students','layout','rules','arrange'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==name);
  });
  if(name==='students') renderStudentsTab();
  if(name==='layout') renderLayoutTab();
  if(name==='rules') renderRulesTab();
  if(name==='arrange') renderArrangeTab();
}

/* ===================== ① 학생 명단 ===================== */
function renderStudentsTab(){
  const el = document.getElementById('tab-students');
  el.innerHTML = `
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl shadow-sm p-6">
        <h2 class="font-bold mb-1">일괄 등록</h2>
        <p class="text-sm text-slate-500 mb-3">한 줄에 한 명씩 입력하세요. "이름" 또는 "이름,성별" 형식이에요. (예: 김다은,여)</p>
        <textarea id="bulkInput" rows="10" class="w-full rounded-xl border border-slate-200 p-3 text-sm" placeholder="김다은,여&#10;나효주,여&#10;박효주,여&#10;..."></textarea>
        <button onclick="App.bulkAdd()" class="mt-3 w-full bg-[#10B981] hover:bg-[#059669] text-white rounded-xl py-2.5 font-medium transition-all duration-200 active:scale-95">일괄 등록</button>
      </div>
      <div class="bg-white rounded-2xl shadow-sm p-6">
        <h2 class="font-bold mb-3">학생 한 명 추가</h2>
        <div class="space-y-3">
          <input id="oneName" placeholder="이름" class="w-full rounded-xl border border-slate-200 p-2.5 text-sm">
          <select id="oneGender" class="w-full rounded-xl border border-slate-200 p-2.5 text-sm">
            <option value="">성별 미지정</option>
            <option value="남">남</option>
            <option value="여">여</option>
          </select>
          <div>
            <p class="text-sm text-slate-600 mb-1.5">자리 선호</p>
            <div class="flex flex-wrap gap-x-4 gap-y-2">
              <label class="flex items-center gap-1.5 text-sm text-slate-600" title="앞자리가 필요해요 (시력·집중 등)">
                <input type="checkbox" id="oneFront"> 앞자리
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600">
                <input type="checkbox" id="oneBack"> 맨 뒷자리
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600">
                <input type="checkbox" id="oneWindow"> 창가 쪽
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600">
                <input type="checkbox" id="oneCorridor"> 복도 쪽
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600" title="키가 작아서 앞쪽 구역이 필요해요">
                <input type="checkbox" id="oneHeightLow" onchange="if(this.checked){document.getElementById('oneHeightMid').checked=false;document.getElementById('oneHeightHigh').checked=false;}"> 키 저
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600" title="키가 중간이라 가운데 구역이 필요해요">
                <input type="checkbox" id="oneHeightMid" onchange="if(this.checked){document.getElementById('oneHeightLow').checked=false;document.getElementById('oneHeightHigh').checked=false;}"> 키 중
              </label>
              <label class="flex items-center gap-1.5 text-sm text-slate-600" title="키가 커서 뒤쪽 구역이 필요해요">
                <input type="checkbox" id="oneHeightHigh" onchange="if(this.checked){document.getElementById('oneHeightLow').checked=false;document.getElementById('oneHeightMid').checked=false;}"> 키 고
              </label>
            </div>
          </div>
          <button onclick="App.addOne()" class="w-full bg-[#10B981] hover:bg-[#059669] text-white rounded-xl py-2.5 font-medium transition-all duration-200 active:scale-95">추가</button>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-6 mt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">학생 명단 <span class="text-[#10B981]">${state.students.length}명</span></h2>
        ${state.students.length ? `<button onclick="App.clearStudents()" class="text-xs text-slate-400 hover:text-red-500">전체 삭제</button>` : ''}
      </div>
      ${state.students.length===0 ? emptyState('아직 등록된 학생이 없어요. 왼쪽에서 명단을 추가해 보세요!') : studentTable()}
    </div>
  `;
}
function studentTable(){
  return `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="text-left text-slate-400 border-b border-slate-100">
      <th class="py-2 font-medium w-16">번호</th><th class="font-medium">이름</th><th class="font-medium">성별</th><th class="font-medium">자리 선호</th><th></th>
    </tr></thead>
    <tbody>${state.students.slice().sort((a,b)=>a.no-b.no).map(s => `
      <tr class="border-b border-slate-50">
        <td class="py-2"><input type="number" value="${s.no}" oninput="App.updateStudent(${s.id},'no',parseInt(this.value)||0)" class="w-14 rounded-lg border border-transparent hover:border-slate-200 p-1.5"></td>
        <td class="py-2"><input value="${s.name}" oninput="App.updateStudent(${s.id},'name',this.value)" class="w-full rounded-lg border border-transparent hover:border-slate-200 p-1.5"></td>
        <td>
          <select onchange="App.updateStudent(${s.id},'gender',this.value)" class="rounded-lg border border-transparent hover:border-slate-200 p-1.5">
            <option value="" ${!s.gender?'selected':''}>-</option>
            <option value="남" ${s.gender==='남'?'selected':''}>남</option>
            <option value="여" ${s.gender==='여'?'selected':''}>여</option>
          </select>
        </td>
        <td>
          <div class="flex flex-wrap gap-2 text-[11px] text-slate-500 max-w-[220px]">
            <label class="flex flex-col items-center gap-0.5 cursor-pointer" title="앞자리 필요">
              <input type="checkbox" ${s.needFront?'checked':''} onchange="App.updateStudent(${s.id},'needFront',this.checked)">앞
            </label>
            <label class="flex flex-col items-center gap-0.5 cursor-pointer" title="맨 뒷자리 필요">
              <input type="checkbox" ${s.needBack?'checked':''} onchange="App.updateStudent(${s.id},'needBack',this.checked)">뒤
            </label>

function renderSeatGrid(seatNums, warnSeats, dangerSeats){
  const grid = document.getElementById('seatGrid');
  if(!grid) return;
  const { rows, cols, blocked } = state.seatConfig;
  let html = '';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const id = `${r}-${c}`;
      if(blocked.includes(id)){
        html += `<div class="seat blocked rounded-xl h-20"></div>`;
      } else {
        const stuId = state.arrangement[id];
        const stu = stuId ? state.students.find(s=>s.id===stuId) : null;
        const cls = ['seat','rounded-xl','h-20','flex','flex-col','items-center','justify-center','shadow-sm','bg-white','border','border-slate-100','p-1'];
        if(id===selectedSeat) cls.push('selected');
        if(dangerSeats.has(id)) cls.push('violation-avoid');
        else if(warnSeats.has(id)) cls.push('violation-must');
        html += `<div class="${cls.join(' ')}" draggable="true"
          onclick="App.selectSeat('${id}')"
          ondragstart="App.dragStart(event,'${id}')"
          ondragend="App.dragEnd(event)"
          ondragover="App.dragOver(event)"
          ondragenter="App.dragEnter(event,'${id}')"
          ondragleave="App.dragLeave(event)"
          ondrop="App.drop(event,'${id}')">
          <span class="text-[10px] text-slate-300">자리 ${seatNums[id]}</span>
          <span class="text-sm font-medium ${stu ? '' : 'text-slate-300'}">${stu ? `${stu.no}. ${stu.name}` : '빈자리'}</span>
        </div>`;
      }
    }
  }
  grid.innerHTML = html;
}
function historyList(){
  return `<div class="space-y-2">${state.history.map(h => `
    <div class="flex items-center justify-between bg-slate-50 rounded-xl px-4 py-2 text-sm">
      <span>${h.label} <span class="text-slate-400">· ${h.time}</span></span>
      <button onclick="App.restoreHistory(${h.id})" class="text-[#10B981] font-medium hover:underline">이 배치로 복원</button>
    </div>`).join('')}</div>`;
}

/* ===================== App (버튼에서 호출되는 함수 모음) ===================== */
const App = {
  bulkAdd(){
    const raw = document.getElementById('bulkInput').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return;
    let no = getNextStudentNo();
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      const name = parts[0];
      const gender = (parts[1]==='남' || parts[1]==='여') ? parts[1] : '';
      if(name){ state.students.push({ id:nextId(), no, name, gender, needFront:false, needBack:false, needWindow:false, needCorridor:false, height:'' }); no++; }
    });
    save(); renderStudentsTab();
  },
  async addOne(){
    const name = document.getElementById('oneName').value.trim();
    if(!name){ await showAlert('이름을 입력하세요'); return; }
    const gender = document.getElementById('oneGender').value;
    const needFront = document.getElementById('oneFront').checked;
    const needBack = document.getElementById('oneBack').checked;
    const needWindow = document.getElementById('oneWindow').checked;
    const needCorridor = document.getElementById('oneCorridor').checked;
    const height = document.getElementById('oneHeightLow').checked ? '저'
      : document.getElementById('oneHeightMid').checked ? '중'
      : document.getElementById('oneHeightHigh').checked ? '고' : '';
    state.students.push({ id:nextId(), no:getNextStudentNo(), name, gender, needFront, needBack, needWindow, needCorridor, height });
    save(); renderStudentsTab();
  },
  updateStudent(id, field, value){
    const st = state.students.find(s=>s.id===id);
    if(!st) return;
    st[field] = value;
    save();
  },
  setHeight(id, value, checked){
    const st = state.students.find(s=>s.id===id);
    if(!st) return;
    st.height = checked ? value : '';
    save(); renderStudentsTab();
  },
  async deleteStudent(id){
    const ok = await showConfirm('이 학생을 삭제할까요? 관련된 제약 조건도 함께 삭제돼요.');
    if(!ok) return;
    state.students = state.students.filter(s=>s.id!==id);
    state.constraints.pairs = state.constraints.pairs.filter(p=>p.a!==id && p.b!==id);
    state.constraints.fixed = state.constraints.fixed.filter(f=>f.studentId!==id);
    Object.keys(state.arrangement).forEach(seat=>{ if(state.arrangement[seat]===id) state.arrangement[seat]=null; });
    save(); renderStudentsTab();
  },
  async clearStudents(){
    const ok = await showConfirm('전체 학생을 삭제할까요?');
    if(!ok) return;
    state.students = []; state.constraints.pairs = []; state.constraints.fixed = []; state.arrangement = {};
    save(); renderStudentsTab();
  },

  async applyLayout(){
    const rows = clamp(parseInt(document.getElementById('rowsInput').value)||5, 1, 12);
    const cols = clamp(parseInt(document.getElementById('colsInput').value)||6, 1, 12);
    const desk = document.getElementById('deskInput').value;
    const frontRows = clamp(parseInt(document.getElementById('frontRowsInput').value)||2, 1, 4);
    const corridor = document.getElementById('corridorInput').value || '복도';
    const win = document.getElementById('windowInput').value || '창가';
    const grade = document.getElementById('gradeInput').value;
    const cls = document.getElementById('classInput').value;
    const quote = document.getElementById('quoteInput').value;

    const changed = rows!==state.seatConfig.rows || cols!==state.seatConfig.cols;
    if(changed && Object.keys(state.arrangement).length){
      const ok = await showConfirm('줄·분단 수를 바꾸면 현재 자리 배치가 초기화돼요. 계속할까요?');
      if(!ok) return;
    }

    state.seatConfig.rows = rows; state.seatConfig.cols = cols; state.seatConfig.deskPosition = desk;
    state.seatConfig.frontRows = frontRows; state.seatConfig.corridorLabel = corridor; state.seatConfig.windowLabel = win;
    state.classInfo.grade = grade; state.classInfo.class = cls; state.quote = quote;

    if(changed){
      state.seatConfig.blocked = state.seatConfig.blocked.filter(id=>{
        const [r,c] = id.split('-').map(Number);
        return r<rows && c<cols;
      });
      state.arrangement = {};
      state.constraints.fixed = [];
    }
    save(); renderLayoutTab();
  },
  toggleBlocked(id){
    const idx = state.seatConfig.blocked.indexOf(id);
    if(idx>-1) state.seatConfig.blocked.splice(idx,1);
    else {
      state.seatConfig.blocked.push(id);
      if(state.arrangement[id]) delete state.arrangement[id];
      const fx = state.constraints.fixed.find(f=>f.seatId===id);
      if(fx) state.constraints.fixed = state.constraints.fixed.filter(f=>f.seatId!==id);
    }
    save(); renderLayoutGrid();
  },

  async addPair(type){
    const a = parseInt(document.getElementById(type+'A').value);
    const b = parseInt(document.getElementById(type+'B').value);
    if(!a || !b || a===b){ await showAlert('서로 다른 두 학생을 선택하세요'); return; }
    const exists = state.constraints.pairs.some(p => p.type===type && ((p.a===a&&p.b===b)||(p.a===b&&p.b===a)));
    if(exists){ await showAlert('이미 등록된 관계예요'); return; }
    state.constraints.pairs.push({ id:nextId(), a, b, type });
    save(); renderRulesTab();
  },
  removePair(id){
    state.constraints.pairs = state.constraints.pairs.filter(p=>p.id!==id);
    save(); renderRulesTab();
  },
  async addFixed(){
    const studentId = parseInt(document.getElementById('fixedStudent').value);
    const seatId = document.getElementById('fixedSeat').value;
    if(!studentId || !seatId){ await showAlert('학생과 자리를 모두 선택하세요'); return; }
    state.constraints.fixed = state.constraints.fixed.filter(f=>f.studentId!==studentId && f.seatId!==seatId);
    state.constraints.fixed.push({ id:nextId(), studentId, seatId });
    save(); renderRulesTab();
  },
  removeFixed(id){
    state.constraints.fixed = state.constraints.fixed.filter(f=>f.id!==id);
    save(); renderRulesTab();
  },
  toggleOption(key, val){
    state.constraints[key] = val;
    save();
  },
  setGenderMode(mode){
    state.constraints.genderMode = mode;
    save();
  },

  async autoAssign(){
    const seats = activeSeatList();
    if(state.students.length===0){ await showAlert('먼저 학생을 등록하세요'); return; }
    if(state.students.length > seats.length){
      await showAlert(`좌석(${seats.length}석)보다 학생(${state.students.length}명)이 많아요. ② 교실 구조를 확인하세요.`);
      return;
    }
    beforeChange('자동 배치 전');

    const fixedMap = {};
    state.constraints.fixed.forEach(f=>{ if(seats.includes(f.seatId)) fixedMap[f.seatId]=f.studentId; });
    const fixedStudentIds = new Set(Object.values(fixedMap));
    const freeSeats = seats.filter(s => !(s in fixedMap));
    const freeStudents = state.students.filter(s => !fixedStudentIds.has(s.id)).map(s=>s.id);

    const prevPairKeys = (state.constraints.avoidRepeatFromHistory && state.history[0])
      ? adjacentPairKeySet(state.history[0].arrangement) : null;

    let best = null, bestScore = Infinity;
    const attempts = 300;
    for(let i=0;i<attempts;i++){
      const seatsShuffled = shuffle(freeSeats.slice());
      const studentsShuffled = shuffle(freeStudents.slice());
      const mapping = {...fixedMap};
      seatsShuffled.forEach((seat, idx) => { mapping[seat] = studentsShuffled[idx] ?? null; });
      const score = scoreArrangement(mapping, prevPairKeys);
      if(score < bestScore){ bestScore = score; best = mapping; if(score===0) break; }
    }
    state.arrangement = best;
    save(); renderArrangeTab();
  },
  async undo(){
    if(!state.history.length){ await showAlert('되돌릴 기록이 없어요'); return; }
    state.arrangement = state.history.shift().arrangement;
    save(); renderArrangeTab();
  },
  restoreHistory(id){
    const entry = state.history.find(h=>h.id===id);
    if(!entry) return;
    beforeChange('복원 전');
    state.arrangement = {...entry.arrangement};
    save(); renderArrangeTab();
  },
  async snapshotManual(){
    const label = await showPrompt('이 배치를 어떤 이름으로 저장할까요?', '수동 저장');
    if(label===null) return;
    const finalLabel = label || '수동 저장';
    state.history.unshift({ id:nextId(), label: finalLabel, time:nowStr(), arrangement:{...state.arrangement} });
    if(state.history.length>15) state.history.length = 15;
    save(); renderArrangeTab();
    await showAlert(`저장했어요! 아래 "배치 기록" 목록에서 "${finalLabel}" 항목을 확인할 수 있어요.`);
    const historySection = document.getElementById('historySection');
    if(historySection) historySection.scrollIntoView({ behavior:'smooth', block:'start' });
  },
  selectSeat(id){
    if(state.seatConfig.blocked.includes(id)) return;
    if(selectedSeat===null){ selectedSeat = id; renderArrangeTab(); return; }
    if(selectedSeat===id){ selectedSeat = null; renderArrangeTab(); return; }
    App.swapSeats(selectedSeat, id, '자리 교환 전');
    selectedSeat = null;
  },
  swapSeats(a, b, label){
    if(!a || !b || a===b) return;
    if(state.seatConfig.blocked.includes(a) || state.seatConfig.blocked.includes(b)) return;
    beforeChange(label || '자리 교환 전');
    const tmp = state.arrangement[a] || null;
    state.arrangement[a] = state.arrangement[b] || null;
    state.arrangement[b] = tmp;
    save(); renderArrangeTab();
  },
  dragStart(e, id){
    if(state.seatConfig.blocked.includes(id)) return;
    e.dataTransfer.setData('text/plain', id);
    e.dataTransfer.effectAllowed = 'move';
    dragSourceSeat = id;
    selectedSeat = null;
    e.currentTarget.classList.add('dragging');
  },
  dragEnd(e){
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    dragSourceSeat = null;
  },
  dragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  },
  dragEnter(e, id){
    e.preventDefault();
    if(state.seatConfig.blocked.includes(id)) return;
    e.currentTarget.classList.add('drag-over');
  },
  dragLeave(e){
    e.currentTarget.classList.remove('drag-over');
  },
  drop(e, id){
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const src = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || dragSourceSeat;
    App.swapSeats(src, id, '드래그로 자리 교환 전');
    dragSourceSeat = null;
  },
  printChart(){ window.print(); },
  async exportImage(){
    if(typeof html2canvas === 'undefined'){
      await showAlert('이미지 저장 기능을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 페이지를 새로고침해서 다시 시도해 주세요.');
      return;
    }
    const target = document.getElementById('printArea');
    try{
      const canvas = await html2canvas(target, { backgroundColor:'#ffffff', scale:2, useCORS:true });
      const label = `${state.classInfo.grade}${state.classInfo.class}`.trim() || '자리배치표';
      const link = document.createElement('a');
      link.download = `${label}_자리배치표.png`;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      await showAlert('이미지가 저장됐어요. 브라우저의 "다운로드" 폴더를 확인해 보세요.');
    }catch(err){
      await showAlert('이미지 저장 중 문제가 생겼어요.\n' + (err && err.message ? err.message : err));
    }
  },
  async exportPDF(){
    if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
      await showAlert('PDF 저장 기능을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 페이지를 새로고침해서 다시 시도해 주세요.');
      return;
    }
    const target = document.getElementById('printArea');
    try{
      const canvas = await html2canvas(target, { backgroundColor:'#ffffff', scale:2, useCORS:true });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
        unit: 'pt',
        format: [canvas.width, canvas.height]
      });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
      const label = `${state.classInfo.grade}${state.classInfo.class}`.trim() || '자리배치표';
      pdf.save(`${label}_자리배치표.pdf`);
      await showAlert('PDF가 저장됐어요. 브라우저의 "다운로드" 폴더를 확인해 보세요.');
    }catch(err){
      await showAlert('PDF 저장 중 문제가 생겼어요.\n' + (err && err.message ? err.message : err));
    }
  }
};

/* ===================== 초기화 ===================== */
document.addEventListener('DOMContentLoaded', () => {
  state = load();
  document.querySelectorAll('#tabNav button').forEach(b=>{
    b.addEventListener('click', ()=> switchTab(b.dataset.tab));
  });
  switchTab('students');
  save();
});
</script>
